# AxVaults (Artillex-Studios/AxVaults) player vaults. Schema confirmed against SQLite.java/MySQL.java/
# H2.java CREATE TABLE: axvaults_data(uuid VARCHAR(36) dashed, storage blob). The plugin's DEFAULT
# backend is H2 2.1.214 (runtime-fetched via Zapper, Libraries.java) — pinned below; the engine fetches
# that exact driver, sniffs the store header and refuses a mismatched file instead of corrupting it.
# The CREATE TABLE is backtick-quoted lowercase, but this H2 url carries no MODE=MySQL: the live
# database (2.9.2) holds AXVAULTS_DATA(ID, UUID, STORAGE, ICON), upper-cased and unquoted. For the
# sqlite/mysql alternatives use the commented blocks AND lowercase the replacer names.
# axvaults_blocks is location-keyed (no uuid); vault item blobs may embed skull uuids (cosmetic).
# Run with the server stopped — vaults are cached in RAM and auto-saved every 5 minutes.
name: axvaults
platform: SPIGOT
type: sql
enabled: true
database:
  type: h2
  database: plugins/AxVaults/data
  h2-version: "2.1.214"
  # AxVaults opens H2 with a null user (new JdbcConnection(url, new Properties(), null, null, false)),
  # so the database has no "sa" — connecting as sa is rejected with "Wrong user name or password".
  username: ""
  password: ""
# database:
#   type: sqlite
#   database: plugins/AxVaults/data.db
# database:
#   type: mysql
#   host: localhost
#   port: 3306
#   username: minecraft
#   password: secret
#   database: axvaults
replacers:
  - table: AXVAULTS_DATA
    column: UUID
# MySQL only (ephemeral cross-server sync queue, unquoted):
#  - table: axvaults_messages
#    column: uuid
