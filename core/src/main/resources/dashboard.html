<!doctype html>
<meta charset="utf-8">
<title>accounts</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0c0e0d; --panel: #141817; --panel-2: #1b201e; --line: #262c29; --line-2: #333b37;
    --fg: #eceeea; --muted: #7f877f; --dim: #575f59;
    --go: #63b58a; --wait: #d9a441; --late: #d97757;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -18px rgba(0,0,0,.9);
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f5f2; --panel: #fff; --panel-2: #fafaf7; --line: #e5e5df; --line-2: #d5d5cc;
            --fg: #14171a; --muted: #6b706b; --dim: #969b96;
            --go: #2f7d55; --wait: #a3701f; --late: #b0502e;
            --shadow: 0 1px 2px rgba(20,23,26,.05), 0 14px 30px -20px rgba(20,23,26,.35); }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
    font-family: var(--sans); font-size: 15px; line-height: 1.5;
    background-image: radial-gradient(130% 70% at 50% -15%, rgba(120,170,145,.09), transparent 65%);
  }
  main { max-width: 54rem; margin: 0 auto; padding: 3.25rem 1.25rem 5rem; }
  .label { font-family: var(--mono); font-size: .68rem; letter-spacing: .17em;
           text-transform: uppercase; color: var(--muted); }

  header { display: flex; align-items: center; gap: .9rem; flex-wrap: wrap;
           padding-bottom: 1.1rem; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 1.2rem; font-weight: 600; letter-spacing: -.02em; }
  .spacer { flex: 1 1 auto; }
  .stat { font-family: var(--mono); font-size: .76rem; color: var(--muted);
          display: inline-flex; align-items: center; gap: .45rem; }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--go);
           animation: beat 2.4s ease-in-out infinite; flex: none; }
  .pulse.off { background: var(--late); animation: none; }
  @keyframes beat { 0%,100% { opacity: 1; box-shadow: 0 0 0 0 rgba(99,181,138,.4); }
                    50% { opacity: .5; box-shadow: 0 0 0 5px rgba(99,181,138,0); } }

  #list { margin-top: 1.6rem; display: flex; flex-direction: column; gap: .8rem; }
  .row { border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
         box-shadow: var(--shadow); overflow: hidden; animation: in .5s cubic-bezier(.2,.7,.3,1) both; }
  .row.leaving { animation: out .55s cubic-bezier(.4,0,.6,1) both; }
  @keyframes in  { from { opacity: 0; transform: translateY(-8px) scale(.99); } }
  @keyframes out { to { opacity: 0; transform: translateY(6px); max-height: 0;
                        margin-bottom: -.8rem; border-color: transparent; } }
  .row.late { border-color: color-mix(in srgb, var(--late) 40%, var(--line)); }
  .row.done { border-color: color-mix(in srgb, var(--go) 45%, var(--line)); }

  /* ---- the face of the row: identity A becomes identity B --------------- */
  .head { display: flex; align-items: center; gap: 1rem; padding: 1.05rem 1.15rem;
          cursor: pointer; user-select: none; background: none; border: 0; width: 100%;
          text-align: left; color: inherit; font: inherit; transition: background .18s ease; }
  .head:hover { background: var(--panel-2); }
  .head:focus-visible { outline: 2px solid var(--go); outline-offset: -3px; }
  .glyphs { display: flex; align-items: center; gap: .55rem; flex: none; }
  .glyph { width: 34px; height: 34px; border-radius: 9px; padding: 4px; flex: none;
           background: var(--panel-2); border: 1px solid var(--line); }
  .glyph.to { box-shadow: 0 0 0 1px color-mix(in srgb, var(--go) 40%, transparent); }
  .becomes { color: var(--dim); font-size: .9rem; }
  .who { min-width: 0; flex: 1 1 auto; }
  .name { font-weight: 600; letter-spacing: -.012em; overflow: hidden;
          text-overflow: ellipsis; white-space: nowrap; }
  .sub { font-size: .78rem; color: var(--muted); margin-top: .1rem; }
  .sub b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
  .right { display: flex; align-items: center; gap: .8rem; flex: none; }
  .clock { font-family: var(--mono); font-size: .74rem; color: var(--muted);
           font-variant-numeric: tabular-nums; }
  .row.late .clock { color: var(--late); }
  .row.done .clock { color: var(--go); }
  .chev { width: 9px; height: 9px; border-right: 1.5px solid var(--dim);
          border-bottom: 1.5px solid var(--dim); transform: rotate(45deg) translate(-2px,-2px);
          transition: transform .25s cubic-bezier(.2,.7,.3,1); }
  .row.open .chev { transform: rotate(225deg) translate(-2px,-2px); }

  .cells { display: grid; gap: 3px; padding: 0 1.15rem 1rem; }
  .cell { height: 5px; border-radius: 3px; background: var(--panel-2);
          border: 1px solid var(--line); position: relative; overflow: hidden; }
  .cell.on { background: var(--go); border-color: var(--go);
             animation: fill .45s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes fill { from { transform: scaleX(0); transform-origin: left; } }
  .cell.off::after { content: ""; position: absolute; inset: 0;
        background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--wait) 38%, transparent), transparent);
        transform: translateX(-100%); animation: sweep 2.8s linear infinite; }
  @keyframes sweep { to { transform: translateX(100%); } }

  /* ---- the detail, only when asked for ---------------------------------- */
  .detail { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s cubic-bezier(.2,.7,.3,1); }
  .row.open .detail { grid-template-rows: 1fr; }
  .detail > .inner { overflow: hidden; }
  .pad { border-top: 1px solid var(--line); padding: 1rem 1.15rem 1.15rem;
         display: grid; gap: .9rem; background: var(--panel-2); }
  .field .label { display: block; margin-bottom: .3rem; }
  .val { display: flex; align-items: center; gap: .5rem; }
  .val code { font-family: var(--mono); font-size: .76rem; color: var(--fg);
              word-break: break-all; line-height: 1.4; }
  .copy { font: inherit; font-family: var(--mono); font-size: .66rem; letter-spacing: .08em;
          text-transform: uppercase; color: var(--muted); background: var(--panel);
          border: 1px solid var(--line); border-radius: 6px; padding: .12rem .45rem;
          cursor: pointer; flex: none; transition: color .15s, border-color .15s; }
  .copy:hover { color: var(--fg); border-color: var(--line-2); }
  .copy.ok { color: var(--go); border-color: color-mix(in srgb, var(--go) 45%, var(--line)); }
  .instances { display: flex; flex-wrap: wrap; gap: .35rem; font-family: var(--mono); font-size: .73rem; }
  .chip { display: inline-flex; align-items: center; gap: .35rem; padding: .1rem .55rem;
          border: 1px solid var(--line); border-radius: 999px; color: var(--dim); }
  .chip.pending { color: var(--wait); border-color: color-mix(in srgb, var(--wait) 35%, var(--line)); }
  .chip .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: none; }
  .chip.pending .dot { animation: beat 1.8s ease-in-out infinite; }

  .empty { border: 1px dashed var(--line); border-radius: 14px; padding: 3.5rem 1rem;
           text-align: center; color: var(--muted); }
  .empty .label { display: block; margin-bottom: .5rem; }
  .err { color: var(--late); }
  @media (max-width: 30rem) {
    .head { gap: .75rem; padding: .9rem; }
    .cells { padding: 0 .9rem .9rem; }
    .clock { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }


  /* ---- the one thing you came here with: a name ------------------------- */
  form.find { margin: 1.8rem 0 0; position: relative; }
  form.find input { width: 100%; font: inherit; font-size: 1.05rem; color: var(--fg);
                    background: var(--panel); border: 1px solid var(--line-2); border-radius: 14px;
                    padding: .85rem 1.1rem .85rem 2.6rem; box-shadow: var(--shadow); }
  form.find input::placeholder { color: var(--dim); }
  form.find input:focus-visible { outline: 2px solid var(--go); outline-offset: -1px; }
  form.find svg { position: absolute; left: .95rem; top: 50%; transform: translateY(-50%);
                  width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2; }
  .hint { margin-top: .5rem; font-size: .78rem; color: var(--dim); }

  .card { border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
          box-shadow: var(--shadow); margin-top: 1.1rem; overflow: hidden; }
  .card > h2 { margin: 0; padding: .9rem 1.15rem; font-size: .9rem; font-weight: 600;
               border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: .6rem; }
  .card > h2 small { font-weight: 400; color: var(--dim); font-size: .76rem; }
  .card .body { padding: 1.05rem 1.15rem 1.15rem; }

  .who { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .who .name { font-size: 1.05rem; font-weight: 600; }
  .ids { display: flex; flex-direction: column; gap: .3rem; margin-top: .9rem; }
  .id { display: flex; align-items: center; gap: .6rem; font-family: var(--mono); font-size: .78rem; }
  .id .tag { color: var(--muted); min-width: 4.6rem; }
  .id .val { color: var(--fg); cursor: pointer; border-bottom: 1px dotted var(--line-2); }
  .id .val:hover { border-bottom-color: var(--go); }
  .id .missing { color: var(--dim); }

  .doing { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1.05rem; align-items: center; }
  .btn { font: inherit; font-size: .85rem; font-weight: 500; cursor: pointer; color: var(--bg);
         background: var(--go); border: 0; border-radius: 999px; padding: .45rem 1.1rem;
         transition: filter .16s ease; }
  .btn:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
  .btn.ghost { background: var(--panel-2); color: var(--fg); border: 1px solid var(--line-2); }
  .btn.small { font-size: .78rem; padding: .3rem .8rem; }
  .btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .outcome { font-family: var(--mono); font-size: .78rem; }
  .outcome.ok { color: var(--go); }
  .outcome.bad { color: var(--late); }

  .transfer { padding: .85rem 1.15rem; border-top: 1px solid var(--line); }
  .transfer:first-child { border-top: 0; }
  .transfer .when { font-family: var(--mono); font-size: .74rem; color: var(--muted); }
  .transfer .pair { font-family: var(--mono); font-size: .76rem; margin-top: .25rem;
                    overflow-wrap: anywhere; }
  .chips { display: flex; gap: .35rem; flex-wrap: wrap; margin-top: .55rem; align-items: center; }
  .chip { font-family: var(--mono); font-size: .7rem; border-radius: 999px; padding: .16rem .6rem;
          border: 1px solid var(--line-2); color: var(--muted); }
  .chip.ok { color: var(--go); border-color: color-mix(in srgb, var(--go) 45%, var(--line)); }
  .chip.wait { color: var(--wait); border-color: color-mix(in srgb, var(--wait) 45%, var(--line)); }
  .chip.bad { color: var(--late); border-color: color-mix(in srgb, var(--late) 50%, var(--line)); }

  /* ---- what is moving, per server ---------------------------------------- */
  .live { padding: .9rem 1.15rem 1rem; border-top: 1px solid var(--line); }
  .live:first-child { border-top: 0; }
  .live .top { display: flex; align-items: center; gap: .6rem; }
  .live .top .label { margin-left: auto; }
  .lanes { display: flex; flex-direction: column; gap: .45rem; margin-top: .7rem; }
  .lane { display: grid; grid-template-columns: minmax(5.5rem, 9rem) 1fr auto; gap: .8rem;
          align-items: center; font-size: .82rem; }
  .lane .who { font-family: var(--mono); font-size: .76rem; overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
  .lane .track { display: block; height: 8px; border-radius: 999px; background: var(--panel-2);
                 border: 1px solid var(--line); overflow: hidden; }
  /* Colour is pace, not state: green while a server is inside its own usual time, amber once it is
     over it, red when it is well over. A server that is always slow is not a fault — it is a server
     with more to move — so it stays green while it behaves like itself. */
  .lane .fill { display: block; height: 100%; border-radius: 999px; background: var(--go);
                transition: width .45s cubic-bezier(.2,.7,.3,1); }
  .lane.late .fill { background: var(--wait); }
  .lane.stalled .fill { background: var(--late); }
  .lane.idle .fill { background: var(--dim); }
  .lane .n { font-family: var(--mono); font-size: .72rem; color: var(--muted);
             min-width: 7.5rem; text-align: right; }
  .lane.done .n { color: var(--go); }
  .lane.late .n { color: var(--wait); }
  .lane.stalled .n { color: var(--late); }

  .servers { display: flex; flex-direction: column; }
  .server { display: grid; grid-template-columns: 1fr auto auto; gap: .9rem; align-items: center;
            padding: .55rem 1.15rem; border-top: 1px solid var(--line); font-size: .84rem; }
  .server:first-child { border-top: 0; }
  .server .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--go);
                 display: inline-block; margin-right: .55rem; }
  .server .dot.off { background: var(--dim); }
  .server .n { font-family: var(--mono); font-size: .76rem; color: var(--muted); }

  details.more { margin-top: 1.4rem; }
  details.more > summary { cursor: pointer; font-size: .82rem; color: var(--muted); padding: .3rem 0; }
  details.more > summary:hover { color: var(--fg); }
  .field { display: flex; flex-direction: column; gap: .3rem; margin-bottom: .7rem; }
  .field input { font: inherit; font-family: var(--mono); font-size: .82rem; color: var(--fg);
                 background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px;
                 padding: .45rem .7rem; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
  .bars { display: flex; flex-direction: column; gap: .45rem; }
  .bar { display: grid; grid-template-columns: minmax(7rem, 13rem) 1fr auto; align-items: center;
         gap: .7rem; font-size: .8rem; }
  .bar .name { font-family: var(--mono); font-size: .74rem; overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
  .bar .track { display: block; height: 6px; border-radius: 999px; background: var(--panel-2);
                border: 1px solid var(--line); overflow: hidden; }
  .bar .fill { display: block; height: 100%; background: var(--go); border-radius: 999px; }
  .bar.worst .fill { background: var(--late); }
  .bar.slow .fill { background: var(--wait); }
  .bar .ms { font-family: var(--mono); font-size: .74rem; color: var(--muted); text-align: right; }
  @media (max-width: 640px) { .two { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
<main>
  <header>
    <h1>accounts</h1>
    <span class="spacer"></span>
    <span class="stat"><span class="pulse" id="pulse"></span><span id="state">connecting</span></span>
  </header>

  <form class="find" id="find" autocomplete="off">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" name="q" spellcheck="false" autofocus
           placeholder="A player's name, or a uuid" aria-label="Find a player">
  </form>
  <div class="hint" id="hint">Whoever the ticket is about. Their name is enough.</div>

  <div id="live"></div>
  <div id="player"></div>

  <div class="card" id="network-card">
    <h2>The network <small id="net-note"></small></h2>
    <div class="servers" id="servers"></div>
  </div>

  <details class="more">
    <summary>Other things</summary>

    <div class="card">
      <h2>Move one identity onto another <small>when you already have both</small></h2>
      <div class="body">
        <div class="two">
          <div class="field"><label class="label" for="p-from">from</label>
            <input id="p-from" spellcheck="false" placeholder="00000000-0000-0000-0000-000000000000"></div>
          <div class="field"><label class="label" for="p-to">to</label>
            <input id="p-to" spellcheck="false" placeholder="00000000-0000-0000-0000-000000000000"></div>
        </div>
        <button class="btn ghost" id="p-go">Move it</button>
        <div class="outcome" id="p-out"></div>
      </div>
    </div>

    <div class="card">
      <h2>Where the time goes <small>average per module, slowest first</small></h2>
      <div class="body"><div class="bars" id="a-modules"></div></div>
    </div>
  </details>
</main>
<script>
  const token = new URLSearchParams(location.search).get('token') || '';
  const q = id => document.getElementById(id);
  const esc = s => String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
  const ms = v => v < 1000 ? Math.round(v) + ' ms'
                : v < 60000 ? (v / 1000).toFixed(1) + ' s'
                : Math.floor(v / 60000) + 'm ' + String(Math.round((v % 60000) / 1000)).padStart(2, '0') + 's';
  const ago = at => {
    if (!at) return 'at some point';
    const s = Math.floor((Date.now() - at) / 1000);
    if (s < 90) return 'just now';
    if (s < 5400) return Math.round(s / 60) + ' minutes ago';
    if (s < 172800) return Math.round(s / 3600) + ' hours ago';
    return new Date(at).toISOString().slice(0, 10);
  };
  const api = async (path, opts) => {
    const sep = path.indexOf('?') >= 0 ? '&' : '?';
    const r = await fetch('api/' + path + sep + 'token=' + encodeURIComponent(token),
                          Object.assign({cache: 'no-store'}, opts || {}));
    if (!r.ok) throw new Error(r.status === 401 ? 'token rejected'
                             : r.status === 403 ? 'this panel is read-only' : await r.text());
    return r;
  };

  function hash(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return h >>> 0;
  }
  function glyph(uuid, cls) {
    const h = hash(uuid);
    const hue = h % 360;
    const light = document.documentElement.dataset.light === '1';
    const fill = `hsl(${hue} 45% ${light ? '42%' : '62%'})`;
    const back = `hsl(${hue} 30% ${light ? '95%' : '16%'})`;
    let cells = '';
    for (let col = 0; col < 3; col++) {
      for (let rowI = 0; rowI < 5; rowI++) {
        if ((h >> ((col * 5 + rowI) % 30)) & 1) {
          cells += `<rect x="${col}" y="${rowI}" width="1" height="1" rx=".22"/>`;
          if (col < 2) cells += `<rect x="${4 - col}" y="${rowI}" width="1" height="1" rx=".22"/>`;
        }
      }
    }
    return `<svg class="glyph ${cls}" viewBox="0 0 5 5" aria-hidden="true" style="background:${back}">
              <g fill="${fill}">${cells}</g></svg>`;
  }


  const mark = uuid => uuid ? glyph(uuid, 'glyph') : '';

  /* ---- the player, which is the whole point ------------------------------ */
  let current = null;

  async function look(query) {
    const box = q('player');
    if (!query) { box.innerHTML = ''; current = null; return; }
    box.innerHTML = '<div class="card"><div class="body"><span class="label">looking…</span></div></div>';
    let d;
    try { d = await (await api('player?q=' + encodeURIComponent(query))).json(); }
    catch (e) { box.innerHTML = '<div class="card"><div class="body"><span class="outcome bad">' +
                                 esc(e.message) + '</span></div></div>'; return; }
    current = d;
    box.innerHTML = card(d);
    wire(d);
  }

  function card(d) {
    const ids = [];
    if (d.offline) ids.push(row('cracked', d.offline));
    if (d.premium) ids.push(row('premium', d.premium));
    else if (d.name) ids.push('<div class="id"><span class="tag">premium</span>' +
                              '<span class="missing">Mojang has no account by that name</span></div>');
    if (d.uuid) ids.push(row('identity', d.uuid));

    const transfers = (d.transfers || []);
    const canMove = d.actions && d.offline && d.premium;
    const head = '<div class="who">' + mark(d.offline || d.uuid) +
      (d.premium ? '<span style="color:var(--muted)">→</span>' + mark(d.premium) : '') +
      '<span class="name">' + esc(d.name || d.uuid) + '</span></div>';

    let doing = '<div class="doing">';
    if (canMove) {
      doing += '<button class="btn" id="go-move">Move them to premium</button>';
    } else if (d.name && !d.premium) {
      doing += '<span class="label">nothing to move them to</span>';
    } else if (!d.actions) {
      doing += '<span class="label">read-only panel</span>';
    }
    doing += '<span class="outcome" id="go-out"></span></div>';

    const history = transfers.length
      ? transfers.map(t => transferRow(t, d.actions)).join('')
      : '<div class="transfer"><span class="label">no transfer on record</span>' +
        '<div class="pair" style="color:var(--dim)">Nothing has ever moved this account. ' +
        'If they say they lost something, it never happened — not that it went wrong.</div></div>';

    return '<div class="card"><div class="body">' + head +
             '<div class="ids">' + ids.join('') + '</div>' + doing + '</div></div>' +
           '<div class="card"><h2>Transfers <small>' +
             (transfers.length ? transfers.length + ' on record' : 'none yet') +
           '</small></h2>' + history + '</div>';
  }

  const row = (tag, value) =>
    '<div class="id"><span class="tag">' + tag + '</span>' +
    '<span class="val" data-copy="' + esc(value) + '" title="click to copy">' + esc(value) + '</span></div>';

  function transferRow(t, actions) {
    const chips = [];
    const failed = new Set(t.failed || []);
    for (const s of t.applied || []) chips.push('<span class="chip ok">' + esc(s) + '</span>');
    // A server that failed is not also waiting: it tried, and it is why this one is not finished.
    for (const s of t.waitingOn || []) if (!failed.has(s)) chips.push('<span class="chip wait">' + esc(s) + ' waiting</span>');
    for (const s of failed) chips.push('<span class="chip bad">' + esc(s) + ' failed</span>');
    const retry = (!t.complete && actions)
      ? '<button class="btn ghost small" data-retry="' + esc(t.from) + '|' + esc(t.to) + '|' +
        esc(t.username || '') + '">Send it again</button>' : '';
    // A transfer still on the wire has no start recorded yet; saying "at some point" about something
    // happening right now reads as a fault.
    const when = t.startedAt ? esc(ago(t.startedAt)) + (t.complete ? ' · done everywhere' : ' · not finished')
                             : 'moving now';
    return '<div class="transfer"><div class="when">' + when + '</div>' +
      '<div class="pair">' + esc(t.from) + ' → ' + esc(t.to) + '</div>' +
      '<div class="chips">' + (chips.join('') || '<span class="label">no server has answered</span>') +
      retry + '</div></div>';
  }

  function wire(d) {
    for (const el of document.querySelectorAll('[data-copy]')) {
      el.addEventListener('click', () => navigator.clipboard && navigator.clipboard.writeText(el.dataset.copy));
    }
    const move = q('go-move');
    if (move) move.addEventListener('click', () => {
      if (!confirm('Move ' + (d.name || '') + '\n\nfrom ' + d.offline + '\nto ' + d.premium +
                   '\n\nEvery server applies this. Back up first.')) return;
      act({from: d.offline, to: d.premium, username: d.name || ''}, q('go-out'));
    });
    for (const el of document.querySelectorAll('[data-retry]')) {
      el.addEventListener('click', () => {
        const [from, to, username] = el.dataset.retry.split('|');
        act({from: from, to: to, username: username}, q('go-out'));
      });
    }
  }

  async function act(fields, outEl) {
    outEl.className = 'outcome';
    outEl.textContent = 'working…';
    try {
      const r = await api('actions/migrate', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: new URLSearchParams(fields).toString()
      });
      outEl.className = 'outcome ok';
      outEl.textContent = await r.text();
      setTimeout(() => look(q('q').value.trim()), 1200);
    } catch (e) {
      outEl.className = 'outcome bad';
      outEl.textContent = e.message;
    }
  }

  /* ---- what is moving: one lane per server, filling as it works ----------- */
  function lanes(m) {
    const applied = new Set(m.applied || []);
    const progress = m.progress || {};
    // Every server this transfer is waiting on, plus the ones already through it.
    const servers = [...new Set([...(m.applied || []), ...(m.waitingOn || [])])];
    const rows = servers.map(name => {
      if (applied.has(name)) {
        return lane(name, 100, 'done', 'done');
      }
      const raw = progress[name];
      if (!raw) {
        return lane(name, 0, 'idle', 'waiting');
      }
      const [counts, startedAt] = raw.split('@');
      const [done, total] = counts.split('/').map(Number);
      const pct = total > 0 ? Math.min(99, Math.round(100 * done / total)) : 0;
      const usual = typical(name);
      const elapsed = startedAt ? Date.now() - Number(startedAt) : 0;
      // Against its own usual time, not against the other servers: one that always takes nine seconds
      // is not slow, it has eleven gigabytes of worlds.
      let cls = '';
      if (usual && elapsed > usual * 2) cls = 'stalled';
      else if (usual && elapsed > usual * 1.25) cls = 'late';
      const note = done + '/' + total + (usual ? ' · ' + ms(elapsed) + ' of ~' + ms(usual) : '');
      return lane(name, pct, cls, note);
    }).join('');
    return '<div class="live"><div class="top">' + mark(m.from) +
      '<span style="color:var(--muted)">→</span>' + mark(m.to) +
      '<span class="label">' + (m.appliedCount || 0) + ' of ' + (m.expectedCount || 0) +
      ' servers</span></div><div class="lanes">' + rows + '</div></div>';
  }

  const lane = (name, pct, cls, note) =>
    '<div class="lane ' + cls + '"><span class="who">' + esc(name) + '</span>' +
    '<span class="track"><span class="fill" style="width:' + pct + '%"></span></span>' +
    '<span class="n">' + esc(note) + '</span></div>';

  /* What this server usually takes for a whole transfer, from what it has actually done before. */
  let averages = {};
  const typical = name => averages[name] || 0;

  /* ---- the glance: what is moving, and whether the network is all here ---- */
  async function refresh() {
    let live = [], stats = null;
    try {
      live = (await (await api('migrations')).json()).inFlight || [];
      q('pulse').classList.remove('off');
      q('state').textContent = live.length ? live.length + ' moving' : 'idle';
    } catch (e) {
      q('pulse').classList.add('off');
      q('state').innerHTML = '<span class="outcome bad">' + esc(e.message) + '</span>';
      return;
    }
    // The averages first: a lane's colour is its pace against them, and a lane drawn before they
    // arrive would be green for a second whatever it was doing.
    try { stats = await (await api('analytics')).json(); } catch (e) { stats = null; }
    if (stats) {
      averages = {};
      for (const i of stats.instances || []) averages[i.name] = i.average;
    }

    q('live').innerHTML = live.length
      ? '<div class="card"><h2>Moving right now <small>' + live.length +
        (live.length > 1 ? ' transfers' : ' transfer') + '</small></h2>' +
        live.map(lanes).join('') + '</div>'
      : '';

    if (!stats) return;
    const active = new Set(stats.active || []);
    const known = (stats.instances || []).slice().sort((a, b) => b.average - a.average);
    const names = new Set([...active, ...known.map(i => i.name)]);
    q('servers').innerHTML = [...names].map(n => {
      const i = known.find(k => k.name === n);
      return '<div class="server"><span><span class="dot' + (active.has(n) ? '' : ' off') + '"></span>' +
        esc(n) + '</span><span class="n">' + (i ? i.runs + ' transfers' : 'no transfer yet') +
        '</span><span class="n">' + (i ? ms(i.average) : '—') + '</span></div>';
    }).join('') || '<div class="server"><span class="label">no server has checked in</span></div>';
    const typical = known.length ? ms(Math.max(...known.map(i => i.average))) : null;
    q('net-note').textContent = active.size + ' of ' + names.size + ' here' +
      (typical ? ' · a transfer takes about ' + typical : '');

    const mods = (stats.modules || []).sort((a, b) => b.average - a.average).slice(0, 10);
    const peak = mods.length ? mods[0].average : 1;
    q('a-modules').innerHTML = mods.map((m, idx) =>
      '<div class="bar ' + (idx === 0 ? 'worst' : m.average > peak / 3 ? 'slow' : '') + '">' +
      '<span class="name" title="' + esc(m.name) + '">' + esc(m.name) + '</span>' +
      '<span class="track"><span class="fill" style="width:' +
      Math.max(1, Math.round(100 * m.average / (peak || 1))) + '%"></span></span>' +
      '<span class="ms">' + ms(m.average) + '</span></div>').join('') ||
      '<span class="label">no transfer has been measured yet</span>';
  }

  let typing = null;
  q('q').addEventListener('input', () => {
    clearTimeout(typing);
    const value = q('q').value.trim();
    typing = setTimeout(() => look(value), 350);
  });
  q('find').addEventListener('submit', e => { e.preventDefault(); look(q('q').value.trim()); });

  q('p-go').addEventListener('click', () => {
    const from = q('p-from').value.trim(), to = q('p-to').value.trim();
    if (!from || !to) { q('p-out').className = 'outcome bad'; q('p-out').textContent = 'both are required'; return; }
    if (!confirm('Move\n\n' + from + '\nto ' + to + '\n\nEvery server applies this.')) return;
    act({from: from, to: to, username: ''}, q('p-out'));
  });

  if (window.matchMedia('(prefers-color-scheme: light)').matches) {
    document.documentElement.dataset.light = '1';
  }
  refresh();
  setInterval(refresh, 4000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') refresh();
  });
</script>
