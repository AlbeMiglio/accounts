# ItemJoin (RockinChaos). SQLite at plugins/ItemJoin/database.db; every table keyed by a player uses
# the same `Player_UUID` column (backtick-quoted VARCHAR in the CREATE TABLE, dashed value). Covers the
# first-join and first-world markers, the per-world enable flags, the ip limits, the cooldowns and the
# three return-item stores that hold a player's items back. ij_map_ids is keyed by map image, not by
# player. Run with the server stopped.
name: itemjoin
platform: SPIGOT
type: sql
enabled: true
database:
  type: sqlite
  database: plugins/ItemJoin/database.db
replacers:
  - table: ij_first_join
    column: Player_UUID
  - table: ij_first_world
    column: Player_UUID
  - table: ij_ip_limits
    column: Player_UUID
  - table: ij_first_commands
    column: Player_UUID
  - table: ij_enabled_players
    column: Player_UUID
  - table: ij_return_items
    column: Player_UUID
  - table: ij_return_craftitems
    column: Player_UUID
  - table: ij_return_switch_items
    column: Player_UUID
  - table: ij_on_cooldown
    column: Player_UUID
