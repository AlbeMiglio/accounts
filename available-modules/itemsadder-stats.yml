# ItemsAdder per-player stats: plugins/ItemsAdder/storage/players/stats/<uuid>.nbt, one file per player
# named by their uuid. The uuid is the file name; the NBT payload holds the stats, not the identity, so
# the migration is a rename. Run with the server stopped — the file is written back on quit.
name: itemsadder-stats
platform: SPIGOT
type: file
directory: plugins/ItemsAdder/storage/players/stats
extension: nbt
enabled: true
